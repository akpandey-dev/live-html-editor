<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live HTML Editor</title>

  <style>

    body {
      background-color: darkgrey;
      margin: 3vh;
      border: 5px solid black;
      min-height: 90vh;
      padding: 4px;
      display: flex;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2vh;
    }

    .title {
      width: 100%;
      border: 2px solid black;
      background: white;
      padding: 8px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: blueviolet;
      font-size: 28px;
    }

    .editor-box {
      width: 100%;
    }

    .editor-title {
      background: black;
      color: white;
      padding: 8px;
      font-size: 14px;
      border: 2px solid black;
      border-bottom: none;
      font-family: monospace;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      padding: 10px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 15px;
      border: 2px solid black;
      background: white;
      outline: none;
    }

    iframe {
      width: 100%;
      min-height: 70vh;
      background: white;
      border: 5px solid white;
      display: none;
    }

    .buttons {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 1000;
    }

    button {
      color: white;
      background-color: darkblue;
      border: none;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: green;
    }

  </style>
</head>
<body>

  <div class="container">

    <marquee class="title" direction="right">
      <h1>LIVE HTML EDITOR</h1>
    </marquee>

    <div class="editor-box">
      <div class="editor-title">HTML</div>
      <textarea id="htmlEditor"><h1>Hello World</h1></textarea>
    </div>

    <div class="editor-box">
      <div class="editor-title">CSS</div>
      <textarea id="cssEditor">
body{
  background:black;
  color:white;
}
      </textarea>
    </div>

    <div class="editor-box">
      <div class="editor-title">JAVASCRIPT</div>
      <textarea id="jsEditor">
console.log("Live HTML Editor");
      </textarea>
    </div>

    <iframe id="preview"></iframe>

  </div>

  <div class="buttons">
    <button id="clear">Clear</button>
    <button id="run">Run</button>
    <button id="back" style="display:none;">Back</button>
  </div>

  <script>

    const htmlEditor = document.getElementById("htmlEditor");
    const cssEditor = document.getElementById("cssEditor");
    const jsEditor = document.getElementById("jsEditor");

    const preview = document.getElementById("preview");

    const runBtn = document.getElementById("run");
    const clearBtn = document.getElementById("clear");
    const backBtn = document.getElementById("back");

    runBtn.onclick = () => {

      const finalCode = `
        ${htmlEditor.value}

        <style>
        ${cssEditor.value}
        </style>

        <script>
        ${jsEditor.value}
        <\/script>
      `;

      preview.srcdoc = finalCode;

      htmlEditor.style.display = "none";
      cssEditor.style.display = "none";
      jsEditor.style.display = "none";

      document.querySelectorAll(".editor-title").forEach(title => {
        title.style.display = "none";
      });

      preview.style.display = "block";

      runBtn.style.display = "none";
      clearBtn.style.display = "none";
      backBtn.style.display = "inline-block";
    };

    backBtn.onclick = () => {

      htmlEditor.style.display = "block";
      cssEditor.style.display = "block";
      jsEditor.style.display = "block";

      document.querySelectorAll(".editor-title").forEach(title => {
        title.style.display = "block";
      });

      preview.style.display = "none";

      runBtn.style.display = "inline-block";
      clearBtn.style.display = "inline-block";
      backBtn.style.display = "none";
    };

    clearBtn.onclick = () => {

      htmlEditor.value = "";
      cssEditor.value = "";
      jsEditor.value = "";

      preview.srcdoc = "";
    };

  </script>

</body>
</html>
