<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live HTML Editor</title>
  <style>
    body {
      background-color: darkgrey;
      margin: 3vh;
      border: 5px solid black;
      min-height: 90vh;
      padding: 4px;
      display: flex;
      justify-content: center;
    }
    .all {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2vh;
      width: 100%;
      max-width: 1000px;
      box-sizing: border-box;
    }


.marquee {
  border: 2px solid black;
  padding: 3px;
  width: 100%;      
  box-sizing: border-box;
  position: relative; 
}


    marquee {
      margin: 0;
      color: blueviolet;
      font-family: monospace;
    }
    .btn-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      width: 100%;
    }
    .toggle-btn {
      color: white;
      background-color: darkgreen;
      width: clamp(120px, 40%, 250px);
      height: clamp(30px, 6vh, 60px); 
      border: none;
      font-size: clamp(12px, 4vw, 22px);
      white-space: nowrap;
      border-radius: 6px;
      box-shadow: 0 5px #0a3d0a;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
      margin: 2%;
      display: block;
    }
    .toggle-btn:hover {
      background-color: #1e7b1e;
    }
    .toggle-btn:active {
      box-shadow: 0 2px #0a3d0a;
      transform: translateY(3px);
    }
    .editor {
      border: 2px solid black;
      width: 100%;
      min-height: 50vh;
      max-height: 65vh;
      background: white;
      padding: 10px;
      box-sizing: border-box;
      overflow-y: auto;
      font-family: monospace;
      white-space: pre-wrap;
      outline: none;
      display: none;
      tab-size: 2;
    
      
    }
    .executed {
      border: 5px solid white;
      width: 100%;
      height: auto;
      margin-top: 1rem;
      min-height: 200px;
      background: white;
      display: none;
    }
    @media (max-width: 500px) {
      body {
        margin: 1vh;
        border-width: 3px;
      }
      .all {
        padding: 0.5rem;
        gap: 1vh;
      }
      .toggle-btn {
        width: 100%;
      }
    }
    .btn-exe-container {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      z-index: 1000;
    }

    .clr-btn,
    .execute-btn,
    .back-btn {
      padding: 0.5rem 1.2rem;
      font-size: 1rem;
      border: none;
      background: darkblue;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }
    .clr-btn:hover,
    .execute-btn:hover,
    .back-btn:hover {
      background: green;
    }


.editor:empty:before {
  content: attr(data-placeholder);
  color: rgba(0,0,0,0.3); /* faint like a watermark */
  pointer-events: none;    
}









  </style>
</head>
<body>
  <div class="all">
    <div class="marquee"><marquee direction="right">LIVE HTML EDITOR (DIV based)</marquee>
</div>

    <div class="btn-container">
      <button class="toggle-btn js-toggle">Toggle JS</button>
      <button class="toggle-btn css-toggle">Toggle CSS</button>
    </div>

    <div id="html-editor" class="editor" contenteditable="true" data-placeholder="HTML CODE HERE..........." style="display:block;" spellcheck="false"></div>
    <div id="js-editor" class="editor" contenteditable="true"   data-placeholder="JS CODE HERE............." spellcheck="false"></div>
    <div id="css-editor" class="editor" contenteditable="true"  data-placeholder="CSS CODE HERE............" spellcheck="false"></div>
  </div>

  <div class="btn-exe-container">
    <button type="button" class="clr-btn">Clear</button>
    <button type="button" class="execute-btn">Run</button>
    <button type="button" class="back-btn" style="display:none;">BACK</button>
  </div>


  <iframe class="executed" id="executed" style="display:none;"></iframe>


  <script>
    const jsToggle = document.querySelector(".js-toggle");
    const cssToggle = document.querySelector(".css-toggle");
    const runBtn = document.querySelector(".execute-btn");
    const clrBtn = document.querySelector(".clr-btn");
    const backBtn = document.querySelector(".back-btn");
    const executedFrame = document.getElementById("executed");

    const htmlEditor = document.getElementById("html-editor");
    const jsEditor = document.getElementById("js-editor");
    const cssEditor = document.getElementById("css-editor");
  

    jsToggle.addEventListener("click", () => {
      jsEditor.style.display = jsEditor.style.display === "block" ? "none" : "block";
    });

    cssToggle.addEventListener("click", () => {
      cssEditor.style.display = cssEditor.style.display === "block" ? "none" : "block";
    });

runBtn.addEventListener("click", () => {
  const htmlContent = htmlEditor.innerText.trim();
  const cssContent = cssEditor.innerText.trim();
  const jsContent = jsEditor.innerText.trim();



    let finalCode;
    const isFullHTML = htmlContent.toLowerCase().includes("<!doctype") || htmlContent.toLowerCase().includes("<html");

    if (isFullHTML) {
      finalCode = htmlContent;
    } else {
      finalCode = `
        ${htmlContent}
        <style>${cssContent}</style>
        <script>${jsContent}<\/script>
      `;
    }

    executedFrame.srcdoc = finalCode;
  
  document.querySelector(".all").style.display = "none";
  executedFrame.style.display = "block";
  clrBtn.style.display = "none";
  runBtn.style.display = "none";
  backBtn.style.display = "inline-block";
});

    backBtn.addEventListener("click", () => {
      document.querySelector(".all").style.display = "flex";
      executedFrame.style.display = "none";
      clrBtn.style.display = "inline-block";
      runBtn.style.display = "inline-block";
      backBtn.style.display = "none";
    });

    clrBtn.addEventListener("click", () => {
      htmlEditor.innerText = "";
      jsEditor.innerText = "";
      cssEditor.innerText = "";
      executedFrame.srcdoc = "";
      executedFrame.style.display = "none";
       jsEditor.style.display = "none";
      cssEditor.style.display = "none";
    });









  </script>
</body>
</html>
