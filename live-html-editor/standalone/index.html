<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live HTML Editor</title>

  <style>

    body{
      background-color: darkgrey;
      margin: 3vh;
      border: 5px solid black;
      min-height: 90vh;
      padding: 4px;
      display: flex;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .container{
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2vh;
    }

    .title{
      width: 100%;
      border: 2px solid black;
      background: white;
      padding: 8px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: blueviolet;
      font-size: 28px;
    }

    .toggle-buttons {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .toggle-btn {
      color: white;
      background-color: darkgreen;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle-btn:hover{
      background-color: green;
    }

    .editor-box {
      width: 100%;
    }

    .editor-title{
      background: black;
      color: white;
      padding: 8px;
      font-size: 14px;
      border: 2px solid black;
      border-bottom: none;
      font-family: monospace;
    }

    textarea{
      width: 100%;
      min-height: 220px;
      resize: vertical;
      padding: 10px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 15px;
      border: 2px solid black;
      background: white;
      outline: none;
    }

    iframe{
      width: 100%;
      min-height: 70vh;
      background: white;
      border: 5px solid white;
      display: none;
    }

    .buttons{
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 1000;
    }

    .buttons button{
      color: white;
      background-color: darkblue;
      border: none;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .buttons button:hover{
      background-color: green;
    }

  </style>
</head>
<body>

  <div class="container">

    <marquee class="title" direction="right">
      <h1>LIVE HTML EDITOR</h1>
    </marquee>

    <div class="toggle-buttons">
      <button class="toggle-btn" id="cssToggle">Toggle CSS</button>
      <button class="toggle-btn" id="jsToggle">Toggle JS</button>
    </div>

    <div class="editor-box">
      <div class="editor-title">HTML</div>
      <textarea id="htmlEditor"><h1>Hello World</h1></textarea>
    </div>

    <div class="editor-box" id="cssBox">
      <div class="editor-title">CSS</div>
      <textarea id="cssEditor">
body{
  background:black;
  color:white;
}
      </textarea>
    </div>

    <div class="editor-box" id="jsBox">
      <div class="editor-title">JAVASCRIPT</div>
      <textarea id="jsEditor">
console.log("Live HTML Editor");
      </textarea>
    </div>

    <iframe id="preview"></iframe>

  </div>

  <div class="buttons">
    <button id="clear">Clear</button>
    <button id="run">Run</button>
    <button id="back" style="display:none;">Back</button>
  </div>

  <script>
    const htmlEditor = document.getElementById("htmlEditor");
  const cssEditor = document.getElementById("cssEditor");
   const jsEditor = document.getElementById("jsEditor");
    const cssBox = document.getElementById("cssBox");
    const jsBox = document.getElementById("jsBox");
const cssToggle = document.getElementById("cssToggle");
  const jsToggle = document.getElementById("jsToggle");
   const preview = document.getElementById("preview");


    const runBtn = document.getElementById("run");
    const clearBtn = document.getElementById("clear");
    const backBtn = document.getElementById("back");

    cssToggle.onclick = () => {

      if (cssBox.style.display === "none") {
        cssBox.style.display = "block";
      } else {
        cssBox.style.display = "none";
      }

    };

    jsToggle.onclick = () => {

      if (jsBox.style.display === "none") {
        jsBox.style.display = "block";
      } else {
        jsBox.style.display = "none";
      }

    };

    runBtn.onclick = () => {

      const finalCode = `
        ${htmlEditor.value}

        <style>
        ${cssEditor.value}
        </style>

        <script>
        ${jsEditor.value}
        <\/script>
      `;

      preview.srcdoc = finalCode;

      document.querySelectorAll(".editor-box").forEach(box => {
        box.style.display = "none";
      });

      document.querySelector(".toggle-buttons").style.display = "none";

      preview.style.display = "block";

      runBtn.style.display = "none";
      clearBtn.style.display = "none";
      backBtn.style.display = "inline-block";
    };

    backBtn.onclick = () => {

      document.querySelectorAll(".editor-box").forEach(box => {
        box.style.display = "block";
      });

      document.querySelector(".toggle-buttons").style.display = "flex";

      preview.style.display = "none";

      runBtn.style.display = "inline-block";
      clearBtn.style.display = "inline-block";
      backBtn.style.display = "none";
    };

    clearBtn.onclick = () => {

      htmlEditor.value = "";
      cssEditor.value = "";
      jsEditor.value = "";

      preview.srcdoc = "";
    };

  </script>

</body>
</html>
